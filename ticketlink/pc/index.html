*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#005bac;--blue-dk:#004a8f;--blue-lt:#e6f0f8;
  --red:#e22228;--text:#1a1a1a;--muted:#888;
  --border:#e0e0e0;--bg:#f7f7f7;
}
html,body{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text);background:var(--bg);min-height:100vh;}

/* ── 메인 헤더 ── */
.main-hd{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:60px;gap:20px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.tl-logo{font-size:22px;font-weight:900;color:#1a1a1a;letter-spacing:-0.04em;text-decoration:none;flex-shrink:0;line-height:1;}
.tl-logo .lt{font-weight:300;}
.gnb{display:flex;align-items:stretch;height:60px;border-left:1px solid #eee;padding-left:14px;gap:0;}
.gnb-item{display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:500;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;text-decoration:none;transition:all 0.12s;white-space:nowrap;}
.gnb-item:hover{color:#333;}
.gnb-item.on{color:var(--text);font-weight:700;border-bottom-color:var(--text);}
.hd-home-link{margin-left:auto;display:flex;align-items:center;gap:5px;padding:6px 14px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-weight:600;color:#555;text-decoration:none;white-space:nowrap;transition:background 0.12s;}
.hd-home-link:hover{background:#f5f5f5;color:#1a1a1a;}

/* ── 스포츠 서브탭 ── */
.sport-sub{background:#fff;border-bottom:2px solid #e0e0e0;padding:0 20px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:60px;z-index:190;}
.sport-sub-item{padding:0 12px;height:44px;display:flex;align-items:center;font-size:13px;font-weight:500;color:#555;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.12s;position:relative;}
.sport-sub-item:hover{color:var(--red);}
.sport-sub-item.on{color:var(--red);border-bottom-color:var(--red);font-weight:700;}
.sport-sub-item .star{font-size:7px;color:var(--red);position:absolute;top:8px;right:3px;}
.sport-sub-item.nostar .star{display:none;}

/* ── 연습 안내바 ── */
.pbar{background:#fffbeb;border-bottom:2px solid #fbbf24;padding:7px 20px;font-size:11px;color:#78350f;display:flex;align-items:center;gap:6px;}

/* ── 본문 ── */
.sports-body{max-width:1060px;margin:0 auto;padding:24px 20px;}

/* ── 배너 ── */
.banner-slot{border-radius:6px;height:170px;display:flex;align-items:flex-end;margin-bottom:28px;position:relative;overflow:hidden;cursor:pointer;}
.banner-slot-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.1) 60%,transparent 100%);}
.banner-slot-txt{position:relative;z-index:2;color:#fff;padding:20px 24px;}
.banner-slot-title{font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-0.02em;margin-bottom:6px;}
.banner-slot-sub{font-size:13px;opacity:0.85;}
.banner-count{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.4);color:#fff;font-size:11px;padding:2px 8px;border-radius:100px;}

/* ── 섹션 레이블 ── */
.sec-lbl{font-size:13px;font-weight:700;color:#333;letter-spacing:0.04em;border-bottom:1px solid #e0e0e0;padding-bottom:10px;margin-bottom:14px;}

/* ── 팀 그리드 ── */
.team-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:28px;}
.team-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;cursor:pointer;border-radius:6px;transition:background 0.15s;text-decoration:none;color:var(--text);}
.team-item:hover{background:#f0f0f0;}
.team-circle{width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid #e8e8e8;display:flex;align-items:center;justify-content:center;font-size:26px;}
.team-nm{font-size:12px;font-weight:500;color:#333;text-align:center;}

@media(max-width:900px){
  .team-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
