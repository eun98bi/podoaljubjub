<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티켓링크 — 포도알줍줍</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#e22228;--text:#1a1a1a;--muted:#888;
  --border:#e8e8e8;--bg:#f5f5f5;
}
html,body{
  font-family:'Noto Sans KR',sans-serif;font-size:14px;
  color:var(--text);background:#fff;
  min-height:100vh;
}

/* ── 전체 앱 래퍼 (모바일 프레임) ── */
.app{
  max-width:430px;margin:0 auto;
  background:#fff;min-height:100vh;
  position:relative;
  padding-bottom:64px;
}

/* 데스크탑에서 폰 느낌 주기 */
@media(min-width:431px){
  body{background:#e0e0e0;}
  .app{
    margin:0 auto;
    box-shadow:0 0 30px rgba(0,0,0,0.25);
    min-height:100vh;
  }
}

/* ── 연습 안내 바 ── */
.pbar{
  background:#fffbeb;border-bottom:2px solid #fbbf24;
  padding:6px 14px;font-size:11px;color:#78350f;
  display:flex;align-items:center;gap:5px;
  position:sticky;top:0;z-index:300;
}

/* ── 앱 상단 헤더 ── */
.app-hd{
  background:#fff;
  padding:10px 14px 0;
  border-bottom:1px solid var(--border);
}
.app-hd-top{
  display:flex;align-items:center;justify-content:space-between;
  height:44px;
}
.app-logo{
  font-size:20px;font-weight:900;letter-spacing:-0.04em;
  color:#1a1a1a;text-decoration:none;line-height:1;
}
.app-logo .lt{font-weight:300;}
.app-hd-home-link{display:flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid #ddd;border-radius:100px;font-size:12px;font-weight:600;color:#555;text-decoration:none;white-space:nowrap;}

/* 공연/전시 | 스포츠 탭 */
.top-cat-tabs{
  display:flex;border-bottom:1px solid var(--border);
  margin-top:4px;
}
.top-cat-tab{
  flex:1;text-align:center;padding:10px 0;
  font-size:15px;font-weight:500;color:#aaa;
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.12s;
}
.top-cat-tab.on{
  color:var(--text);font-weight:700;
  border-bottom-color:var(--text);
}

/* ── 배너 캐러셀 ── */
.banner-wrap{
  position:relative;overflow:hidden;
  width:100%;aspect-ratio:16/9;
  background:#1a2240;
  cursor:pointer;
}
.banner-slide{
  width:100%;height:100%;
  display:flex;align-items:flex-end;
  padding:20px 16px;
  position:relative;
}
.banner-bg{
  position:absolute;inset:0;
  object-fit:cover;width:100%;height:100%;
}
.banner-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
}
.banner-txt{position:relative;z-index:2;color:#fff;}
.banner-title{font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-0.02em;}
.banner-date{font-size:12px;margin-top:5px;opacity:0.9;}
.banner-sub{font-size:12px;opacity:0.8;margin-top:1px;}
.banner-count-badge{
  position:absolute;bottom:12px;right:12px;z-index:3;
  background:rgba(0,0,0,0.4);color:#fff;
  font-size:12px;padding:3px 10px;border-radius:100px;
}

/* ── 카테고리 칩 탭 ── */
.cat-section{
  padding:12px 14px 0;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding-bottom:10px;
}
.cat-row{display:flex;gap:7px;flex-wrap:wrap;}
.cat-chip{
  padding:6px 14px;border-radius:100px;
  border:1px solid var(--border);
  font-size:13px;font-weight:500;color:#444;
  cursor:pointer;transition:all 0.12s;
  white-space:nowrap;
}
.cat-chip.on{
  background:#1a1a1a;color:#fff;
  border-color:#1a1a1a;
}
.cat-chip:hover:not(.on){background:#f5f5f5;}

/* ── 팀 로고 그리드 ── */
.team-section{
  background:#fff;
  padding:14px 14px 6px;
  border-bottom:1px solid var(--border);
}
.team-scroll{
  display:flex;gap:4px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:8px;
}
.team-scroll::-webkit-scrollbar{display:none;}
.team-item{
  display:flex;flex-direction:column;align-items:center;
  gap:7px;padding:6px 10px;
  cursor:pointer;border-radius:8px;
  transition:background 0.12s;flex-shrink:0;
  text-decoration:none;
}
.team-item:hover{background:#f5f5f5;}
.team-logo-circle{
  width:60px;height:60px;border-radius:12px;
  background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.team-logo-inner{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  text-align:center;line-height:1.2;
}
.team-nm{font-size:12px;font-weight:500;color:#333;white-space:nowrap;}

/* 구단 색상 */
.logo-lg{background:linear-gradient(135deg,#c8102e,#001489);}
.logo-samsung{background:linear-gradient(135deg,#074ca1,#1a5caa);}
.logo-hanwha{background:linear-gradient(135deg,#f05a28,#ff7043);}
.logo-kt{background:linear-gradient(135deg,#000,#333);}
.logo-ssg{background:linear-gradient(135deg,#ce0e2d,#00205b);}
.logo-nc{background:linear-gradient(135deg,#071d49,#0e3d78);}
.logo-lotte{background:linear-gradient(135deg,#002561,#e31837);}
.logo-kia{background:linear-gradient(135deg,#ea0029,#000);}
.logo-doosan{background:linear-gradient(135deg,#131230,#2a2876);}
.logo-hanhwa{background:linear-gradient(135deg,#f05a28,#c44214);}


/* ── 하단 네비게이션 ── */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:#fff;border-top:1px solid var(--border);
  display:flex;z-index:500;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:8px 4px 6px;
  cursor:pointer;text-decoration:none;color:#999;
  transition:color 0.12s;
}
.nav-item.on{color:var(--red);}
.nav-icon{font-size:22px;line-height:1;margin-bottom:2px;}
.nav-label{font-size:10px;font-weight:500;}

/* ── 떠있는 버튼 ── */
.fab-group{
  position:fixed;right:calc(50% - 215px);bottom:80px;
  display:flex;flex-direction:column;gap:8px;
  z-index:400;
}
@media(max-width:430px){.fab-group{right:12px;}}
.fab-btn{
  width:40px;height:40px;border-radius:50%;
  background:#fff;border:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;color:#555;
}
</style>
</head>
<body>

<div class="app">

  <!-- 연습 안내 -->
  <div class="pbar">⚡ <strong>연습 모드:</strong> 티켓링크 UI를 재현한 티켓팅 연습 페이지입니다.</div>

  <!-- 앱 헤더 -->
  <header class="app-hd">
    <div class="app-hd-top">
      <a href="index.html" class="app-logo">TICKET<span class="lt">LINK</span></a>
      <a href="../../index.html" class="app-hd-home-link">🍇 메인</a>
    </div>
    <div class="top-cat-tabs">
      <div class="top-cat-tab" onclick="location.href='#'">공연/전시</div>
      <div class="top-cat-tab on">스포츠</div>
    </div>
  </header>

  <!-- 쿠팡 파트너스 배너 -->
  <div id="cpqOuter" style="overflow:hidden;width:100%;background:#fff;">
    <div id="cpqInner" style="width:680px;transform-origin:left top;">
      <script src="https://ads-partners.coupang.com/g.js"></script>
      <script>
        new PartnersCoupang.G({"id":982793,"template":"carousel","trackingCode":"AF9566167","width":"680","height":"140","tsource":""});
      </script>
    </div>
  </div>
  <p style="font-size:10px;color:#bbb;padding:3px 14px 6px;text-align:right;background:#fff;">이 배너는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  <script>
    (function(){
      var outer = document.getElementById('cpqOuter');
      var inner = document.getElementById('cpqInner');
      var scale = outer.offsetWidth / 680;
      inner.style.transform = 'scale(' + scale + ')';
      outer.style.height = Math.ceil(140 * scale) + 'px';
    })();
  </script>

  <!-- 카테고리 칩 -->
  <div class="cat-section">
    <div class="cat-row">
      <div class="cat-chip on" onclick="selectCat(this,'baseball')">야구</div>
      <div class="cat-chip" onclick="selectCat(this,'soccer')">축구</div>
      <div class="cat-chip" onclick="selectCat(this,'handball')">핸드볼</div>
      <div class="cat-chip" onclick="selectCat(this,'icehockey')">아이스하키</div>
      <div class="cat-chip" onclick="selectCat(this,'basketball')">농구</div>
      <div class="cat-chip" onclick="selectCat(this,'volleyball')">배구</div>
      <div class="cat-chip" onclick="selectCat(this,'esports')">e스포츠&amp;게임</div>
    </div>
  </div>

  <!-- 팀 로고 -->
  <div class="team-section">
    <div class="team-scroll">
      <a class="team-item" href="sports.html?team=lg">
        <div class="team-logo-circle"><div class="team-logo-inner logo-lg">LG<br>TWINS</div></div>
        <span class="team-nm">LG트윈스</span>
      </a>
      <a class="team-item" href="sports.html?team=hanwha">
        <div class="team-logo-circle"><div class="team-logo-inner logo-hanwha">HW<br>Eagles</div></div>
        <span class="team-nm">한화이글스</span>
      </a>
      <a class="team-item" href="sports.html?team=samsung">
        <div class="team-logo-circle"><div class="team-logo-inner logo-samsung">SS<br>Lions</div></div>
        <span class="team-nm">삼성 라이온즈</span>
      </a>
      <a class="team-item" href="sports.html?team=kt">
        <div class="team-logo-circle"><div class="team-logo-inner logo-kt">kt<br>wiz</div></div>
        <span class="team-nm">kt wiz</span>
      </a>
    </div>
  </div>


</div><!-- /.app -->

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a class="nav-item" href="#">
    <div class="nav-icon">☰</div>
    <div class="nav-label">카테고리</div>
  </a>
  <a class="nav-item" href="#">
    <div class="nav-icon">🔍</div>
    <div class="nav-label">검색</div>
  </a>
  <a class="nav-item on" href="index.html">
    <div class="nav-icon">🏠</div>
    <div class="nav-label">홈</div>
  </a>
  <a class="nav-item" href="#">
    <div class="nav-icon">🎫</div>
    <div class="nav-label">티켓</div>
  </a>
  <a class="nav-item" href="#">
    <div class="nav-icon">👤</div>
    <div class="nav-label">마이</div>
  </a>
</nav>

<!-- 떠있는 버튼 -->
<div class="fab-group">
  <div class="fab-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
</div>

<script>
// 카테고리 칩 선택
function selectCat(el, cat){
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(cat === 'baseball'){
    // 현재 페이지 유지
  } else {
    alert('준비 중입니다.');
    el.classList.remove('on');
    document.querySelector('.cat-chip').classList.add('on');
  }
}
</script>
</body>
</html>
